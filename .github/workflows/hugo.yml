\f0\fs24 \cf0 # Sample workflow for building and deploying a Hugo site to GitHub Pages\
name: Deploy Hugo site to Pages\
\
on:\
  # Runs on pushes targeting the default branch\
  push:\
    branches: ["master"]\
\
  # Allows you to run this workflow manually from the Actions tab\
  workflow_dispatch:\
\
# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages\
permissions:\
  contents: read\
  pages: write\
  id-token: write\
\
# Allow one concurrent deployment\
concurrency:\
  group: "pages"\
  cancel-in-progress: true\
\
# Default to bash\
defaults:\
  run:\
    shell: bash\
\
jobs:\
  # Build job\
  build:\
    runs-on: ubuntu-latest\
    env:\
      HUGO_VERSION: 0.108.0\
    steps:\
      - name: Install Hugo CLI\
        run: |\
          wget -O $\{\{ runner.temp \}\}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v$\{HUGO_VERSION\}/hugo_extended_$\{HUGO_VERSION\}_linux-amd64.deb \\\
          && sudo dpkg -i $\{\{ runner.temp \}\}/hugo.deb\
      - name: Install Dart Sass\
        run: |\
          SASS_VERSION=1.69.5\
          curl -LO https://github.com/sass/dart-sass/releases/download/$\{SASS_VERSION\}/dart-sass-$\{SASS_VERSION\}-linux-x64.tar.gz\
          tar -xzf dart-sass-$\{SASS_VERSION\}-linux-x64.tar.gz\
          echo "$GITHUB_WORKSPACE/dart-sass" >> $GITHUB_PATH\
      - name: Checkout\
        uses: actions/checkout@v3\
        with:\
          submodules: recursive\
      - name: Setup Pages\
        id: pages\
        uses: actions/configure-pages@v3\
      - name: Install Node.js dependencies\
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"\
      - name: Build with Hugo\
        env:\
          # For maximum backward compatibility with Hugo modules\
          HUGO_ENVIRONMENT: production\
          HUGO_ENV: production\
        run: |\
          hugo \\\
            --minify \\\
            --baseURL "$\{\{ steps.pages.outputs.base_url \}\}/"\
      - name: Upload artifact\
        uses: actions/upload-pages-artifact@v3\
        with:\
          path: ./public\
\
  # Deployment job\
  deploy:\
    environment:\
      name: github-pages\
      url: $\{\{ steps.deployment.outputs.page_url \}\}\
    runs-on: ubuntu-latest\
    needs: build\
    steps:\
      - name: Deploy to GitHub Pages\
        id: deployment\
        uses: actions/deploy-pages@v4}